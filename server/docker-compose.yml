services:
  ultrachat:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: "/data"
    volumes:
      - ultrachat-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - ultrachat
    environment:
      DOMAIN: "${DOMAIN:?Укажите домен в .env, например chat.example.ru}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ultrachat-data:
  caddy-data:
  caddy-config:
